name: Bug report
description: Report reproducible image, runtime, or documentation behavior
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not disclose vulnerabilities here. Use the private security link
        shown before opening an issue.
  - type: input
    id: image
    attributes:
      label: Image tag and digest
      description: Include both when available; do not report only a mutable tag.
      placeholder: ghcr.io/datopsis/lakekeeper-ubi:v0.13.4-ubi9-r20260910.1@sha256:...
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime, host, and versions
      placeholder: RHEL and Podman, Docker, or OpenShift versions
    validations:
      required: true
  - type: input
    id: database
    attributes:
      label: PostgreSQL version and deployment
      description: Include the major version and whether it is managed or self-hosted.
      placeholder: PostgreSQL 17.6, self-hosted container
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - linux/amd64
        - linux/arm64
        - Other or unknown
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Minimal Lakekeeper and deployment configuration
      description: >-
        Remove the encryption key, database password, object-store credentials,
        tokens, internal names, and other secrets.
      render: text
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Reproduction and observed behavior
      description: List exact steps, the result, and the expected result.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets and personal or internal information.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and tested the current development revision or a supported release.
          required: true
        - label: I confirmed the behavior is not simply an upstream Lakekeeper issue reproducible on the upstream image.
          required: false
        - label: I removed secrets and sensitive data from this report.
          required: true
