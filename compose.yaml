# Development stack only. It exercises the image against a real PostgreSQL
# instance; it is not a deployment pattern. No credential has a default value:
# provision secret files and a local `.env` as described in README.md.
# Build PostgreSQL with scripts/build-postgres.sh, then explicitly provision
# its role and extensions before starting migrate/serve.
#
# Compose refuses to start without the encryption key, and the image refuses
# again at startup. The two checks are deliberate duplicates: the first gives a
# fast local error, the second protects every deployment that does not use
# Compose. See docs/CONFIGURATION.md.

x-lakekeeper-environment: &lakekeeper-environment
  LAKEKEEPER__PG_DATABASE_URL_WRITE: >-
    postgres://lakekeeper:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/lakekeeper
  LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER__PG_ENCRYPTION_KEY:?set LAKEKEEPER__PG_ENCRYPTION_KEY in .env}

x-lakekeeper-hardening: &lakekeeper-hardening
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    # Locally built from datopsis/postgresql-lakekeeper-ubi at the reviewed
    # artifacts/postgresql-lakekeeper.commit pin. No registry image exists.
    image: ${POSTGRES_IMAGE:-localhost/postgresql-lakekeeper-ubi:development}
    user: "26:0"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: lakekeeper
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
      - lakekeeper-password
    healthcheck:
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=lakekeeper"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    volumes:
      - postgres-data:/var/lib/pgsql
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_signal: SIGINT

  # `serve` requires an already-migrated database, so migration is a separate
  # one-shot unit rather than a startup side effect of the server.
  migrate:
    image: localhost/lakekeeper-ubi9:development
    command: ["migrate"]
    environment: *lakekeeper-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    <<: *lakekeeper-hardening

  lakekeeper:
    image: localhost/lakekeeper-ubi9:development
    command: ["serve"]
    environment: *lakekeeper-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8181:8181"
    stop_signal: SIGTERM
    <<: *lakekeeper-hardening

# File ownership/modes are enforced by the PostgreSQL entrypoint. Compose file
# secrets may preserve host metadata; prepare them as documented in README.md.
secrets:
  postgres-password:
    file: ${POSTGRES_ADMIN_PASSWORD_FILE:?set POSTGRES_ADMIN_PASSWORD_FILE in .env}
  lakekeeper-password:
    file: ${POSTGRES_APP_PASSWORD_FILE:?set POSTGRES_APP_PASSWORD_FILE in .env}

volumes:
  postgres-data:
